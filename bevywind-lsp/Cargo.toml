[package]
name = "bevywind-lsp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bevywind-lsp"
path = "src/main.rs"

[dependencies]
bevywind-core = { path = "../core" }
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
